name: Rebuild database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install converter
        run: gem install fbtxt2json --no-document
      - name: Fetch sources
        run: ./scripts/fetch_sources.sh
      - name: Convert Football.TXT
        run: ./scripts/convert_txt.sh
      - name: Build database
        run: python3 scripts/build_db.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/football.sqlite.gz
          git diff --cached --quiet || git commit -m "Rebuild database from upstream sources"
          git push
