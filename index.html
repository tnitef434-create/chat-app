<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #fff; overflow: hidden; }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    height: 100vh;
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px;
    gap: 12px;
  }

  /* Sidebar */
  .sidebar {
    width: 280px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.08);
    padding-right: 8px;
  }
  .sidebar-header {
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .new-chat-btn {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    padding: 12px 20px;
    border-radius: 9999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .new-chat-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.25);
  }
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding-top: 12px;
    scrollbar-width: none;
  }
  .history-list::-webkit-scrollbar { display: none; }
  .history-item {
    padding: 10px 16px;
    border-radius: 9999px;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    transition: all 0.2s;
    background: transparent;
    border: 1px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .history-item:hover {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.9);
  }
  .history-item.active {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-color: rgba(255,255,255,0.15);
  }
  .history-item .title {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .history-item .date {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    flex-shrink: 0;
  }

  /* Main chat */
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .logo {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px rgba(255,255,255,0.6);
  }
  .header-actions { display: flex; gap: 6px; }

  /* Modern button */
  .btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    padding: 8px 18px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
  }
  .btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-1px);
  }
  .btn:active {
    transform: translateY(0);
  }
  .btn-primary {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  .btn-primary:hover {
    background: #e6e6e6;
    box-shadow: 0 0 20px rgba(255,255,255,0.4);
  }

  /* Chat container */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px 4px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: none;
  }
  .chat-container::-webkit-scrollbar { display: none; }

  /* Message */
  .message {
    max-width: 75%;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .message.user {
    align-self: flex-end;
    text-align: right;
  }
  .message.ai {
    align-self: flex-start;
    text-align: left;
  }

  .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
    display: inline-block;
  }
  .message.user .bubble {
    background: #fff;
    color: #000;
    border-radius: 9999px 16px 9999px 9999px;
  }
  .message.ai .bubble {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    border-radius: 9999px 9999px 9999px 16px;
  }

  /* Markdown rendering */
  .bubble b { font-weight: 700; }
  .bubble i { font-style: italic; }
  .bubble.streaming { opacity: 0.9; }

  /* Thinking effect */
  .thinking {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    opacity: 0;
    animation: fadeIn 0.3s ease-out forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  .thinking-dots { display: flex; gap: 3px; }
  .thinking-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1.4s ease-in-out infinite both;
  }
  .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
  .thinking-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .input-wrapper {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .input-field {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 9999px;
    padding: 12px 20px;
    font-size: 15px;
    color: #fff;
    resize: vertical;
    min-height: 44px;
    max-height: 160px;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-field:focus { border-color: rgba(255,255,255,0.4); }
  .input-field::placeholder { color: rgba(255,255,255,0.4); }

  .send-btn {
    width: 44px;
    height: 44px;
    border-radius: 9999px;
    border: none;
    background: #fff;
    color: #000;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
  }
  .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255,255,255,0.4); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .footer-hint {
    text-align: center;
    font-size: 13px;
    color: #fff;
    margin-top: 8px;
    padding: 8px 20px;
    border-radius: 9999px;
    background: rgba(255,255,255,0.04);
    border: 8px solid rgba(255,255,255,0.08);
    display: inline-block;
    align-self: center;
  }
</style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="newChat()">
          + New Chat
        </button>
      </div>
      <div class="history-list" id="historyList"></div>
    </aside>

    <!-- Main Chat -->
    <div class="chat-main">
      <header class="header">
        <div class="logo">
          <span class="status-dot"></span>
          <span>Chat</span>
        </div>
        <div class="header-actions">
          <button class="btn" onclick="clearChat()">Clear</button>
          <button class="btn" onclick="openSettings()" title="Settings">⚙</button>
        </div>
      </header>

      <main class="chat-container" id="chatContainer">
        <div class="footer-hint">Modern B/W Chat Interface</div>
      </main>

      <footer class="input-area">
        <div class="input-wrapper">
          <textarea class="input-field" id="messageInput" placeholder="Type here..." rows="1"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>→</button>
        </div>
      </footer>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:100;align-items:center;justify-content:center;">
    <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:28px;width:90%;max-width:420px;">
      <h3 style="font-size:16px;font-weight:600;margin-bottom:16px;text-align:center;">Settings</h3>
      <p style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:16px;text-align:center;">API key is configured via Cloudflare Workers secrets.</p>
      <div style="display:flex;gap:8px;">
        <button class="btn" style="flex:1;border-radius:9999px;padding:10px 20px;" onclick="closeSettings()">Close</button>
      </div>
    </div>
  </div>

  <script>
    let conversations = JSON.parse(localStorage.getItem('chatConversations') || '[]');
    let currentConvId = null;
    let chatHistory = [];

    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('messageInput');
    const chatContainer = document.getElementById('chatContainer');
    const historyList = document.getElementById('historyList');

    window.addEventListener('load', () => {
      renderHistoryList();
      if (conversations.length > 0 && !currentConvId) {
        currentConvId = conversations[0].id;
      }
      renderCurrentChat();
    });

    // Auto-resize textarea
    messageInput.addEventListener('input', () => {
      sendBtn.disabled = messageInput.value.trim() === '';
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
    });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !sendBtn.disabled) {
        e.preventDefault();
        sendMessage();
      }
    });

    function getSessionTitle(messages) {
      const first = messages.find(m => m.role === 'user');
      if (first) {
        return first.content.length > 40 ? first.content.substring(0, 37) + '…' : first.content;
      }
      return 'New Chat';
    }

    function formatDate(timestamp) {
      const d = new Date(timestamp);
      const now = new Date();
      const diff = now - d;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      if (days < 1) {
        return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      } else if (days < 7) {
        return d.toLocaleDateString([], {weekday: 'short'});
      } else {
        return d.toLocaleDateString([], {month: 'short', day: 'numeric'});
      }
    }

    function saveConversations() {
      localStorage.setItem('chatConversations', JSON.stringify(conversations));
    }

    function renderHistoryList() {
      historyList.innerHTML = '';
      if (conversations.length === 0) return;

      conversations.slice().reverse().forEach(conv => {
        const item = document.createElement('div');
        item.className = 'history-item' + (conv.id === currentConvId ? ' active' : '');
        item.onclick = () => loadConversation(conv.id);

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = getSessionTitle(conv.messages);

        const date = document.createElement('div');
        date.className = 'date';
        date.textContent = formatDate(conv.timestamp);

        item.appendChild(title);
        item.appendChild(date);
        historyList.appendChild(item);
      });
    }

    function newChat() {
      if (chatHistory.length > 0 && currentConvId) {
        const convIndex = conversations.findIndex(c => c.id === currentConvId);
        if (convIndex >= 0) {
          conversations[convIndex].messages = chatHistory;
          conversations[convIndex].timestamp = Date.now();
        }
      }

      currentConvId = null;
      chatHistory = [];
      renderHistoryList();
      renderCurrentChat();
    }

    function loadConversation(convId) {
      if (chatHistory.length > 0 && currentConvId) {
        const convIndex = conversations.findIndex(c => c.id === currentConvId);
        if (convIndex >= 0) {
          conversations[convIndex].messages = chatHistory;
        }
      }

      const conv = conversations.find(c => c.id === convId);
      if (conv) {
        currentConvId = convId;
        chatHistory = JSON.parse(JSON.stringify(conv.messages));
        renderHistoryList();
        renderCurrentChat();
      }
    }

    function renderCurrentChat() {
      chatContainer.innerHTML = '';
      if (chatHistory.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'footer-hint';
        empty.textContent = 'Start a conversation…';
        empty.style.margin = 'auto';
        chatContainer.appendChild(empty);
        return;
      }
      chatHistory.forEach(msg => addMessageToDOM(msg.role, msg.content));
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&').replace(/</g,'<').replace(/>/g,'>');
    }

    function renderMarkdown(text) {
      let html = escapeHtml(text);
      html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      html = html.replace(/\*(.+?)\*/g, '<i>$1</i>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function addMessageToDOM(role, content) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + role;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = renderMarkdown(content);

      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    function addThinkingToDOM() {
      const thinkingDiv = document.createElement('div');
      thinkingDiv.className = 'thinking';
      thinkingDiv.id = 'thinkingIndicator';

      const dotContainer = document.createElement('div');
      dotContainer.className = 'thinking-dots';
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('div');
        dot.className = 'thinking-dot';
        dotContainer.appendChild(dot);
      }
      thinkingDiv.appendChild(dotContainer);
      chatContainer.appendChild(thinkingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return thinkingDiv;
    }

    function removeThinking() {
      const thinking = document.getElementById('thinkingIndicator');
      if (thinking) {
        thinking.style.animation = 'fadeOut 0.3s ease-out forwards';
        setTimeout(() => thinking.remove(), 300);
      }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      messageInput.value = '';
      sendBtn.disabled = true;
      messageInput.style.height = 'auto';

      if (!currentConvId) {
        currentConvId = 'conv_' + Date.now();
        conversations.unshift({
          id: currentConvId,
          messages: [],
          timestamp: Date.now()
        });
        saveConversations();
        renderHistoryList();
      }

      addMessageToDOM('user', text);
      chatHistory.push({role:'user', content:text});

      addThinkingToDOM();

      try {
        await callProxyAPI(text);
      } catch (err) {
        removeThinking();
        addMessageToDOM('ai', 'Error: ' + err.message);
      }
    }

    async function callProxyAPI(userText) {
      const payload = {
        messages: [
          { role: 'system', content: 'You are a helpful AI assistant. Format responses with **bold** and *italic* markdown when appropriate.' },
          ...chatHistory.map(m => ({ role: m.role, content: m.content }))
        ],
        model: 'z-ai/glm-5.2',
        max_tokens: 16384,
        stream: false,
        temperature: 1,
        top_p: 0.95
      };

      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const err = await response.text();
        throw new Error('API Error: ' + response.status + ' ' + err);
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error);
      }

      removeThinking();

      const content = data.choices?.[0]?.message?.content || '(no response)';
      addMessageToDOM('ai', content);
      chatHistory.push({role:'ai', content: content});

      const convIndex = conversations.findIndex(c => c.id === currentConvId);
      if (convIndex >= 0) {
        conversations[convIndex].messages = chatHistory;
        conversations[convIndex].timestamp = Date.now();
      }
      saveConversations();
      renderHistoryList();
    }

    function addStreamingMessage(role, content) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + role;

      const bubble = document.createElement('div');
      bubble.className = 'bubble streaming';
      bubble.textContent = content;

      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return bubble;
    }

    function updateStreamingMessage(bubble, content) {
      bubble.textContent = content;
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function clearChat() {
      if (currentConvId) {
        conversations = conversations.filter(c => c.id !== currentConvId);
        saveConversations();
      }
      currentConvId = null;
      chatHistory = [];
      renderHistoryList();
      renderCurrentChat();
    }

    // Settings Modal
    function openSettings() {
      document.getElementById('settingsModal').style.display = 'flex';
    }
    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }
  </script>
</body>
</html>
